<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drawing School Supplies (D.S.S)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            position: relative; 
            user-select: none;
        }
        
        /* --- NGÔN NGỮ (LANGUAGE SELECTOR) --- */
        #lang-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 5px 10px;
            border: 2px solid #333;
            border-radius: 20px;
            box-shadow: 2px 2px 0 #333;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        #lang-select {
            border: none;
            outline: none;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            cursor: pointer;
            color: #333;
            max-width: 150px;
        }

        /* --- BẢNG VẼ (BÊN TRÁI) --- */
        #left-panel {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 40%;
            min-width: 320px;
            background: #fff;
            display: flex;
            flex-direction: column;
            border-right: 4px solid #333;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        #left-panel.hidden {
            transform: translateX(-100%);
            border-right: none; 
        }
        
        #draw-ui {
            padding: 15px;
            background: #fdfdfd;
            border-bottom: 2px dashed #ccc;
            position: relative;
            padding-right: 50px;
            padding-top: 40px;
        }
        #draw-ui h3 { margin: 0 0 5px 0; color: #333; }
        #draw-ui p { margin: 0 0 10px 0; font-size: 13px; color: #666; }
        .stroke-counter { 
            font-size: 24px; font-weight: bold; color: #e74c3c; margin-bottom: 10px; transition: color 0.2s;
        }
        .btn-group { display: flex; gap: 10px; }
        button {
            padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer;
            border: 2px solid #333; border-radius: 8px; box-shadow: 3px 3px 0 #333; transition: all 0.1s;
        }
        button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #333; }
        button:disabled { background-color: #ddd; color: #999; cursor: not-allowed; border-color: #999; box-shadow: 3px 3px 0 #999; }
        #btn-clear { background-color: #e74c3c; color: white; flex: 1; }
        #btn-start { background-color: #2ecc71; color: white; flex: 2; }
        
        #btn-close-panel {
            position: absolute; top: 45px; right: 15px; width: 36px; height: 36px; padding: 0;
            font-size: 18px; background-color: #ff6b6b; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 #333; line-height: 1;
        }

        #btn-open-panel {
            position: absolute; top: 60px; left: 20px; padding: 10px 15px; font-size: 15px;
            background-color: #3498db; color: white; border-radius: 50px; z-index: 100;
            display: none; align-items: center; gap: 8px;
        }
        #btn-open-panel.show { display: flex; }

        #draw-canvas-container { flex: 1; position: relative; background: #fdfdfd; overflow: hidden; }
        #drawCanvas { position: absolute; top: 0; left: 0; display: block; touch-action: none; cursor: crosshair;}

        /* --- ĐẤU TRƯỜNG (BÊN PHẢI) --- */
        #right-panel {
            position: absolute;
            top: 0; bottom: 0; right: 0;
            left: max(40%, 320px); 
            background: #fdfdfd;
            transition: left 0.3s ease;
            z-index: 1;
        }
        #left-panel.hidden ~ #right-panel { left: 0; }

        #gameCanvas { display: block; }
        
        #game-ui {
            position: absolute; top: 60px; right: 20px; pointer-events: none; z-index: 5; text-align: right;
        }
        .hp-bar {
            width: 250px; height: 22px; background-color: #eee; border: 2px solid #333;
            border-radius: 11px; overflow: hidden; margin-bottom: 8px; box-shadow: 2px 2px 0 #333; margin-left: auto;
        }
        .hp-fill { height: 100%; background-color: #e74c3c; width: 100%; transition: width 0.1s; }
        #stats { font-size: 18px; font-weight: bold; color: #333; text-shadow: 1px 1px 0 #fff; }
        
        #skills {
            margin-top: 10px; font-size: 14px; font-weight: bold; color: #333;
            background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px;
            border: 2px solid #333; box-shadow: 2px 2px 0 #333; text-align: left;
        }
        #skills div { margin-bottom: 5px; }
        #skills div:last-child { margin-bottom: 0; }
        .skill-ready { color: #2ecc71; }
        .skill-cooldown { color: #e74c3c; }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; background: white; padding: 30px; border: 3px solid #333;
            border-radius: 15px; box-shadow: 5px 5px 0 #333; display: none; z-index: 10;
        }
        #game-over h2 { margin: 0 0 10px 0; color: #e74c3c; }
        #game-over p { margin: 0; color: #333; font-weight: bold;}

        /* --- GIAO DIỆN MOBILE (JOYSTICK & NÚT BẤM) --- */
        #mobile-controls { display: none; }
        
        @media (max-width: 900px) or (pointer: coarse) {
            #left-panel { width: 100%; min-width: 100%; border-right: none; }
            #right-panel { left: 0; }
            #controls-hint { display: none !important; }
            #game-ui { top: 20px; }
            #btn-close-panel { top: 15px; }
            
            #mobile-controls {
                display: block; position: absolute; bottom: 0; left: 0; right: 0; height: 150px;
                pointer-events: none; z-index: 100;
            }

            /* Joystick */
            #joystick-zone {
                position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px;
                background: rgba(0,0,0,0.1); border-radius: 50%; pointer-events: auto;
                border: 2px solid rgba(0,0,0,0.2); touch-action: none;
            }
            #joystick-knob {
                position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
                background: rgba(0,0,0,0.4); border-radius: 50%; transform: translate(-50%, -50%);
                pointer-events: none;
            }

            /* Skill Buttons */
            .mobile-skill-btn {
                position: absolute; bottom: 20px; width: 65px; height: 65px; border-radius: 50%;
                background: rgba(255,255,255,0.9); border: 2px solid #333; font-weight: bold; font-size: 16px;
                pointer-events: auto; display: flex; flex-direction: column; justify-content: center; align-items: center;
                box-shadow: 2px 2px 0 #333; user-select: none;
            }
            .mobile-skill-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #333; }
            .mobile-skill-btn .cd-text { font-size: 10px; color: #e74c3c; margin-top: 2px;}
            
            #btn-e { right: 170px; background: #f1c40f; color: #333;}
            #btn-t { right: 95px; background: #ecf0f1; color: #333;}
            #btn-z { right: 20px; background: #3498db; color: white;}
        }
    </style>
</head>

        };

        let currentLang = 'vi';
        const langSelect = document.getElementById('lang-select');

        function t(key) {
            return translations[currentLang][key] || translations['en'][key] || key;
        }

        function applyTranslations() {
            // Tự động đổi hướng chữ cho tiếng Ả Rập (RTL)
            if (currentLang === 'ar') {
                document.documentElement.dir = 'rtl';
                document.body.style.direction = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
                document.body.style.direction = 'ltr';
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = t(key);
            });
            updateGameUI();
            updateSkillUI();
        }

        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            applyTranslations();
        });

        // --- KHỞI TẠO CANVAS ---
        const drawCanvas = document.getElementById('drawCanvas');
        const dCtx = drawCanvas.getContext('2d');
        const gameCanvas = document.getElementById('gameCanvas');
        const gCtx = gameCanvas.getContext('2d');

        const leftPanel = document.getElementById('left-panel');
        const btnOpenPanel = document.getElementById('btn-open-panel');

        let drawWidth, drawHeight;
        let gameWidth, gameHeight;

        function resize() {
            const drawContainer = document.getElementById('draw-canvas-container');
            if (!leftPanel.classList.contains('hidden') && drawContainer.clientWidth > 0) {
                drawWidth = drawCanvas.width = drawContainer.clientWidth;
                drawHeight = drawCanvas.height = drawContainer.clientHeight;
            }
            
            const gameContainer = document.getElementById('right-panel');
            gameWidth = gameCanvas.width = gameContainer.clientWidth;
            gameHeight = gameCanvas.height = gameContainer.clientHeight;

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                player.x = Math.max(player.radius, Math.min(gameWidth - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(gameHeight - player.radius, player.y));
            }
        }

        const MAX_STROKES = 100;
        let gameState = 'IDLE'; 
        
        let strokes = []; 
        let currentStroke = [];
        let isDrawing = false; 

        const player = {
            x: 0, y: 0, speed: 6, radius: 30, hp: 0, maxHp: 0,
            invulnerable: false, allStrokes: [], activeStrokes: [],
            maxRadius: 30 
        };

        let enemies = [];
        let pencils = [];
        let eraserDust = [];
        let keys = {};

        const MAX_PENCIL_INVENTORY = 2;
        let pencilInventory = 2;
        let pencilCooldownTimer = 0;
        let pencilActive = false;
        let pencilTargetStroke = null;
        let pencilProgress = 0;
        let pencilDuration = 1; 

        let swordCooldownTimer = 0;
        let swordActive = false;
        let swordTime = 0;
        const SWORD_DURATION = 0.3; 
        const SWORD_LENGTH = 100; 

        let rulerCooldownTimer = 0;
        let rulerActive = false;
        let rulerTime = 0;
        const RULER_DURATION = 5.0; 
        let rulerRadius = 65; 
        const RULER_THICKNESS = 12; 

        // --- BIẾN JOYSTICK ---
        let joyVector = { x: 0, y: 0 };
        let joyActive = false;
        let joyCenter = { x: 0, y: 0 };
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');

        function triggerE() {
            if (gameState === 'PLAYING' && pencilCooldownTimer <= 0 && !pencilActive && pencilInventory > 0 && player.activeStrokes.length < player.allStrokes.length) {
                const missing = player.allStrokes.filter(s => !player.activeStrokes.includes(s));
                pencilTargetStroke = missing[Math.floor(Math.random() * missing.length)];
                pencilDuration = Math.max(1, pencilTargetStroke.length * 0.03); 
                pencilProgress = 0;
                pencilActive = true;
                pencilInventory--;
                pencilCooldownTimer = 36;
                updateSkillUI();
            }
        }

        function triggerT() {
            if (gameState === 'PLAYING' && swordCooldownTimer <= 0 && !swordActive) {
                swordActive = true;
                swordTime = SWORD_DURATION;
                swordCooldownTimer = 20;
                updateSkillUI();
            }
        }

        function triggerZ() {
            if (gameState === 'PLAYING' && rulerCooldownTimer <= 0 && !rulerActive) {
                rulerActive = true;
                rulerTime = RULER_DURATION;
                rulerCooldownTimer = 20;
                updateSkillUI();
            }
        }

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'e') triggerE();
            if (e.key.toLowerCase() === 't') triggerT();
            if (e.key.toLowerCase() === 'z') triggerZ();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        document.getElementById('btn-e').addEventListener('pointerdown', (e) => { e.preventDefault(); triggerE(); });
        document.getElementById('btn-t').addEventListener('pointerdown', (e) => { e.preventDefault(); triggerT(); });
        document.getElementById('btn-z').addEventListener('pointerdown', (e) => { e.preventDefault(); triggerZ(); });

        joystickZone.addEventListener('pointerdown', (e) => {
            joyActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            updateJoystick(e.clientX, e.clientY);
            e.preventDefault();
        });

        window.addEventListener('pointermove', (e) => {
            if (joyActive) {
                updateJoystick(e.clientX, e.clientY);
                e.preventDefault();
            }
        });

        window.addEventListener('pointerup', () => {
            if (joyActive) {
                joyActive = false;
                joyVector = { x: 0, y: 0 };
                joystickKnob.style.transform = `translate(-50%, -50%)`;
            }
        });

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joyCenter.x;
            let dy = clientY - joyCenter.y;
            let dist = Math.hypot(dx, dy);
            let maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVector.x = dx / maxDist;
            joyVector.y = dy / maxDist;
        }

        drawCanvas.addEventListener('pointerdown', (e) => {
            if (strokes.length >= MAX_STROKES) return;
            if (gameState === 'GAMEOVER') {
                gameState = 'IDLE';
                document.getElementById('game-over').style.display = 'none';
            }

            const rect = drawCanvas.getBoundingClientRect();
            isDrawing = true;
            currentStroke = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
            strokes.push(currentStroke);
            updateDrawingUI();
        });

        drawCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || currentStroke.length === 0) return;
            const rect = drawCanvas.getBoundingClientRect();
            let x = Math.max(0, Math.min(drawWidth, e.clientX - rect.left));
            let y = Math.max(0, Math.min(drawHeight, e.clientY - rect.top));
            let lastPoint = currentStroke[currentStroke.length - 1];
            
            if (Math.hypot(x - lastPoint.x, y - lastPoint.y) > 4) {
                currentStroke.push({ x, y });
            }
        });

        window.addEventListener('pointerup', () => { isDrawing = false; });
        window.addEventListener('pointercancel', () => { isDrawing = false; });

        document.getElementById('btn-close-panel').addEventListener('click', () => {
            leftPanel.classList.add('hidden');
            btnOpenPanel.classList.add('show');
            setTimeout(resize, 320);
        });

        btnOpenPanel.addEventListener('click', () => {
            leftPanel.classList.remove('hidden');
            btnOpenPanel.classList.remove('show');
            setTimeout(resize, 320);
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            if (gameState === 'PLAYING' && !confirm(t('confirm_clear'))) return;
            strokes = [];
            currentStroke = [];
            isDrawing = false; 
            
            if (gameState === 'GAMEOVER') {
                gameState = 'IDLE';
                document.getElementById('game-over').style.display = 'none';
            }
            updateDrawingUI();
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            if (strokes.length === 0) return;
            applyDrawing();
            if (!leftPanel.classList.contains('hidden')) {
                leftPanel.classList.add('hidden');
                btnOpenPanel.classList.add('show');
                setTimeout(resize, 320);
            }
        });

        function updateDrawingUI() {
            const counter = document.getElementById('stroke-count');
            counter.innerText = `${strokes.length} / ${MAX_STROKES}`;
            document.getElementById('btn-start').disabled = strokes.length === 0;
            counter.style.color = strokes.length >= MAX_STROKES ? '#2ecc71' : '#e74c3c';
        }

        function applyDrawing() {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            strokes.forEach(stroke => stroke.forEach(p => {
                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
            }));

            let centerX = (minX + maxX) / 2;
            let centerY = (minY + maxY) / 2;
            let maxDim = Math.max(maxX - minX, maxY - minY);
            let scale = maxDim > 150 ? 150 / maxDim : 1;
            if (scale < 0.2) scale = 0.2;

            player.allStrokes = strokes.map(stroke => 
                stroke.map(p => ({ x: (p.x - centerX) * scale, y: (p.y - centerY) * scale }))
            );
            player.activeStrokes = [...player.allStrokes];
            player.maxHp = player.activeStrokes.length;
            player.hp = player.maxHp;
            player.radius = Math.max(20, (maxDim * scale) / 2 + 15);

            let maxDist = 0;
            player.allStrokes.forEach(stroke => {
                stroke.forEach(p => {
                    let dist = Math.hypot(p.x, p.y);
                    if (dist > maxDist) maxDist = dist;
                });
            });
            player.maxRadius = maxDist;
            rulerRadius = player.maxRadius + 30;

            if (gameState === 'GAMEOVER' || gameState === 'IDLE') {
                enemies = []; pencils = []; eraserDust = [];
                player.x = gameWidth / 2;
                player.y = gameHeight / 2;
                gameState = 'PLAYING';
                document.getElementById('game-over').style.display = 'none';
            }
            
            pencilActive = false;
            swordActive = false;
            rulerActive = false;
            isDrawing = false; 
            
            updateGameUI();
            updateSkillUI();
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
            var dx = x2 - x1;
            var dy = y2 - y1;
            var l2 = dx * dx + dy * dy;
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            var t = ((px - x1) * dx + (py - y1) * dy) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        let lastTimestamp = 0;
        let lastEnemySpawn = 0;
        let lastPencilSpawn = 0;

        function updateGame(dt) {
            if (gameState !== 'PLAYING') return;

            if (pencilCooldownTimer > 0) pencilCooldownTimer -= dt;
            if (swordCooldownTimer > 0) swordCooldownTimer -= dt;
            if (rulerCooldownTimer > 0) rulerCooldownTimer -= dt;
            
            if (rulerActive) {
                rulerTime -= dt;
                if (rulerTime <= 0) rulerActive = false;
            }

            updateSkillUI(); 

            if (pencilActive) {
                pencilProgress += dt / pencilDuration;
                if (pencilProgress >= 1) {
                    pencilActive = false;
                    player.activeStrokes.push(pencilTargetStroke);
                    player.hp = player.activeStrokes.length;
                    pencilTargetStroke = null;
                    updateGameUI();
                }
            }

            if (swordActive) {
                swordTime -= dt;
                if (swordTime <= 0) {
                    swordActive = false;
                } else {
                    const progress = 1 - swordTime / SWORD_DURATION;
                    const swordAngle = -Math.PI / 2 + progress * Math.PI; 
                    const swordRange = player.radius + SWORD_LENGTH;

                    for (let i = enemies.length - 1; i >= 0; i--) {
                        let e = enemies[i];
                        let dx = e.x - player.x;
                        let dy = e.y - player.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < swordRange && dist > 10) {
                            let enemyAngle = Math.atan2(dy, dx);
                            let angleDiff = Math.abs(enemyAngle - swordAngle);
                            if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
                            
                            if (angleDiff < Math.PI / 4) {
                                createEraserDust(e.x, e.y);
                                enemies.splice(i, 1);
                            }
                        }
                    }
                }
            }

            let currentSpeed = player.speed;
            if (pencilActive) currentSpeed *= 0.5;

            let moveX = 0, moveY = 0;
            
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;
            if (keys['w'] || keys['arrowup']) moveY -= 1;
            if (keys['s'] || keys['arrowdown']) moveY += 1;

            if (joyVector.x !== 0 || joyVector.y !== 0) {
                moveX = joyVector.x;
                moveY = joyVector.y;
            }

            let moveDist = Math.hypot(moveX, moveY);
            if (moveDist > 0) {
                moveX = (moveX / moveDist) * currentSpeed;
                moveY = (moveY / moveDist) * currentSpeed;
                player.lastMoveAngle = Math.atan2(moveY, moveX);
                player.x += moveX;
                player.y += moveY;
            }

            player.x = Math.max(player.radius, Math.min(gameWidth - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(gameHeight - player.radius, player.y));

            const now = Date.now();

            if (now - lastEnemySpawn > 1500) {
                const side = Math.floor(Math.random() * 4);
                let ex, ey;
                if (side === 0) { ex = Math.random() * gameWidth; ey = -50; }
                else if (side === 1) { ex = gameWidth + 50; ey = Math.random() * gameHeight; }
                else if (side === 2) { ex = Math.random() * gameWidth; ey = gameHeight + 50; }
                else { ex = -50; ey = Math.random() * gameHeight; }
                enemies.push({ x: ex, y: ey, speed: 2.0 + Math.random() * 1.5, angle: 0 });
                lastEnemySpawn = now;
            }

            if (now - lastPencilSpawn > 3500) {
                pencils.push({
                    x: 50 + Math.random() * (gameWidth - 100),
                    y: 50 + Math.random() * (gameHeight - 100),
                    angle: Math.random() * Math.PI * 2, life: 8000 
                });
                lastPencilSpawn = now;
            }

            if (rulerActive) {
                const r = rulerRadius;
                const t = RULER_THICKNESS;
                const eraserRad = 20;
                const x1 = player.x - r; const y1 = player.y - r;
                const x2 = player.x + r; const y2 = player.y + r;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    const dTop = distToSegment(e.x, e.y, x1, y1, x2, y1);
                    const dBottom = distToSegment(e.x, e.y, x1, y2, x2, y2);
                    const dLeft = distToSegment(e.x, e.y, x1, y1, x1, y2);
                    const dRight = distToSegment(e.x, e.y, x2, y1, x2, y2);

                    if (dTop < (t/2 + eraserRad) || dBottom < (t/2 + eraserRad) || 
                        dLeft < (t/2 + eraserRad) || dRight < (t/2 + eraserRad)) {
                        createEraserDust(e.x, e.y);
                        enemies.splice(i, 1);
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let ex_dx = player.x - e.x;
                let ex_dy = player.y - e.y;
                let dist = Math.sqrt(ex_dx * ex_dx + ex_dy * ex_dy);

                if (dist > 0) {
                    e.x += (ex_dx / dist) * e.speed;
                    e.y += (ex_dy / dist) * e.speed;
                    e.angle = Math.atan2(ex_dy, ex_dx);
                }

                if (dist < player.radius + 20 && !player.invulnerable) {
                    let damage = (player.hp > 50) ? 10 : 1;
                    for (let d = 0; d < damage; d++) {
                        if (player.activeStrokes.length > 0) {
                            const randomIndex = Math.floor(Math.random() * player.activeStrokes.length);
                            player.activeStrokes.splice(randomIndex, 1);
                        }
                    }
                    
                    player.hp = player.activeStrokes.length;
                    createEraserDust(player.x, player.y);
                    
                    if (pencilActive) {
                        pencilActive = false;
                        pencilTargetStroke = null;
                    }

                    player.invulnerable = true;
                    setTimeout(() => player.invulnerable = false, 1000);

                    enemies.splice(i, 1);
                    updateGameUI();

                    if (player.activeStrokes.length === 0) {
                        gameState = 'GAMEOVER';
                        document.getElementById('game-over').style.display = 'block';
                        strokes = [];
                        currentStroke = [];
                        updateDrawingUI();
                        
                        if (leftPanel.classList.contains('hidden')) {
                            leftPanel.classList.remove('hidden');
                            btnOpenPanel.classList.remove('show');
                            setTimeout(resize, 320);
                        }
                    }
                }
            }

            for (let i = pencils.length - 1; i >= 0; i--) {
                let p = pencils[i];
                p.life -= 16;
                p.angle += 0.02;

                if (p.life <= 0) { pencils.splice(i, 1); continue; }

                let p_dx = player.x - p.x;
                let p_dy = player.y - p.y;
                let dist = Math.sqrt(p_dx * p_dx + p_dy * p_dy);

                if (dist < player.radius + 20) {
                    pencils.splice(i, 1);
                    if (pencilInventory < MAX_PENCIL_INVENTORY) {
                        pencilInventory++;
                    } else if (player.activeStrokes.length < player.allStrokes.length) {
                        const missing = player.allStrokes.filter(s => !player.activeStrokes.includes(s));
                        player.activeStrokes.push(missing[Math.floor(Math.random() * missing.length)]);
                        player.hp = player.activeStrokes.length; 
                    }
                    updateGameUI();
                    updateSkillUI();
                }
            }

            for (let i = eraserDust.length - 1; i >= 0; i--) {
                let d = eraserDust[i];
                d.x += d.vx; d.y += d.vy;
                d.vx *= 0.95; d.vy *= 0.95;
                d.life -= 0.02;
                if (d.life <= 0) eraserDust.splice(i, 1);
            }
        }

        function drawGame() {
            gCtx.fillStyle = '#fdfdfd';
            gCtx.fillRect(0, 0, gameWidth, gameHeight);

            gCtx.strokeStyle = '#f0f0f0';
            gCtx.lineWidth = 1;
            for(let i=0; i<gameWidth; i+=40) { gCtx.beginPath(); gCtx.moveTo(i, 0); gCtx.lineTo(i, gameHeight); gCtx.stroke(); }
            for(let i=0; i<gameHeight; i+=40) { gCtx.beginPath(); gCtx.moveTo(0, i); gCtx.lineTo(gameWidth, i); gCtx.stroke(); }

            if (gameState === 'IDLE') {
                gCtx.fillStyle = '#aaa';
                gCtx.font = 'bold 24px "Segoe UI", Tahoma, sans-serif';
                gCtx.textAlign = 'center';
                gCtx.fillText(t('idle_hint_1'), gameWidth / 2, gameHeight / 2 - 20);
                gCtx.fillText(t('idle_hint_2'), gameWidth / 2, gameHeight / 2 + 20);
                return;
            }

            eraserDust.forEach(d => {
                gCtx.fillStyle = d.color;
                gCtx.globalAlpha = d.life;
                gCtx.beginPath(); gCtx.arc(d.x, d.y, d.size, 0, Math.PI * 2); gCtx.fill();
            });
            gCtx.globalAlpha = 1.0;

            pencils.forEach(p => drawPencil(p.x, p.y, p.angle));
            enemies.forEach(e => drawEraser(e.x, e.y, e.angle));

            if (player.activeStrokes.length > 0) {
                drawPlayer();
            }

            if (swordActive) {
                const progress = 1 - swordTime / SWORD_DURATION;
                const angle = -Math.PI / 2 + progress * Math.PI; 
                gCtx.save();
                gCtx.translate(player.x, player.y);
                gCtx.rotate(angle);
                
                gCtx.beginPath();
                gCtx.arc(0, 0, SWORD_LENGTH, -0.15, 0.15); 
                gCtx.strokeStyle = 'rgba(200, 200, 255, 0.8)';
                gCtx.lineWidth = 5;
                gCtx.stroke();

                gCtx.fillStyle = '#f1c40f';
                gCtx.fillRect(0, -6, 30, 12);
                gCtx.strokeStyle = '#333';
                gCtx.lineWidth = 2;
                gCtx.strokeRect(0, -6, 30, 12);
                
                gCtx.beginPath();
                gCtx.moveTo(10, -6); gCtx.lineTo(10, 6);
                gCtx.moveTo(20, -6); gCtx.lineTo(20, 6);
                gCtx.stroke();

                gCtx.fillStyle = '#bdc3c7';
                gCtx.beginPath();
                gCtx.moveTo(30, -5);
                gCtx.lineTo(80, -5); 
                gCtx.lineTo(SWORD_LENGTH, 0);  
                gCtx.lineTo(30, 6);  
                gCtx.closePath();
                gCtx.fill();
                gCtx.strokeStyle = '#7f8c8d';
                gCtx.stroke();
                
                gCtx.fillStyle = '#ecf0f1';
                gCtx.beginPath();
                gCtx.ellipse(55, 0, 6, 2, 0, 0, Math.PI * 2);
                gCtx.fill();
                gCtx.stroke();

                gCtx.beginPath();
                gCtx.moveTo(30, 0);
                gCtx.lineTo(90, 0);
                gCtx.strokeStyle = 'rgba(0,0,0,0.1)';
                gCtx.stroke();
                gCtx.restore();
            }

            if (rulerActive) {
                const r = rulerRadius;
                const t = RULER_THICKNESS;
                gCtx.save();
                
                gCtx.beginPath();
                gCtx.rect(player.x - r, player.y - r, r*2, r*2);
                gCtx.lineWidth = t;
                gCtx.strokeStyle = 'rgba(52, 152, 219, 0.4)'; 
                gCtx.stroke();

                gCtx.lineWidth = 2;
                gCtx.strokeStyle = '#2980b9';
                gCtx.strokeRect(player.x - r - t/2, player.y - r - t/2, r*2 + t, r*2 + t);
                gCtx.strokeRect(player.x - r + t/2, player.y - r + t/2, r*2 - t, r*2 - t);

                gCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                gCtx.lineWidth = 1;
                
                for(let i = -r + 10; i <= r - 10; i+=10) {
                    let lineH = (i % 20 === 0) ? t/2 : t/4;
                    gCtx.beginPath(); gCtx.moveTo(player.x + i, player.y - r - t/2); gCtx.lineTo(player.x + i, player.y - r - t/2 + lineH); gCtx.stroke();
                    gCtx.beginPath(); gCtx.moveTo(player.x + i, player.y + r + t/2); gCtx.lineTo(player.x + i, player.y + r + t/2 - lineH); gCtx.stroke();
                }
                
                for(let i = -r + 10; i <= r - 10; i+=10) {
                    let lineH = (i % 20 === 0) ? t/2 : t/4;
                    gCtx.beginPath(); gCtx.moveTo(player.x - r - t/2, player.y + i); gCtx.lineTo(player.x - r - t/2 + lineH, player.y + i); gCtx.stroke();
                    gCtx.beginPath(); gCtx.moveTo(player.x + r + t/2, player.y + i); gCtx.lineTo(player.x + r + t/2 - lineH, player.y + i); gCtx.stroke();
                }
                gCtx.restore();
            }
        }

        function drawPlayer() {
            gCtx.strokeStyle = '#1a1a1a';
            gCtx.lineWidth = 4;
            gCtx.lineCap = 'round';
            gCtx.lineJoin = 'round';

            if (player.invulnerable && Math.floor(Date.now() / 100) % 2 === 0) {
                gCtx.globalAlpha = 0.3;
            }

            gCtx.save();
            gCtx.translate(player.x, player.y);

            player.activeStrokes.forEach(stroke => {
                gCtx.beginPath();
                if (stroke.length === 1) {
                    gCtx.arc(stroke[0].x, stroke[0].y, 3, 0, Math.PI * 2);
                    gCtx.fillStyle = '#1a1a1a';
                    gCtx.fill();
                } else {
                    gCtx.moveTo(stroke[0].x, stroke[0].y);
                    for (let i = 1; i < stroke.length; i++) gCtx.lineTo(stroke[i].x, stroke[i].y);
                    gCtx.stroke();
                }
            });

            if (pencilActive && pencilTargetStroke) {
                const totalPoints = pencilTargetStroke.length;
                const pointsToDraw = Math.floor(totalPoints * pencilProgress);
                if (pointsToDraw > 0) {
                    gCtx.beginPath();
                    gCtx.moveTo(pencilTargetStroke[0].x, pencilTargetStroke[0].y);
                    for (let i = 1; i <= pointsToDraw && i < totalPoints; i++) {
                        gCtx.lineTo(pencilTargetStroke[i].x, pencilTargetStroke[i].y);
                    }
                    gCtx.strokeStyle = '#3498db'; 
                    gCtx.lineWidth = 6;
                    gCtx.stroke();
                    gCtx.strokeStyle = '#1a1a1a';
                    gCtx.lineWidth = 4;
                }

                gCtx.save();
                gCtx.rotate(-Math.PI/4);
                gCtx.fillStyle = '#f1c40f';
                gCtx.fillRect(10, -25, 6, 20);
                gCtx.fillStyle = '#e67e22';
                gCtx.beginPath();
                gCtx.moveTo(10, -25);
                gCtx.lineTo(13, -33);
                gCtx.lineTo(16, -25);
                gCtx.fill();
                gCtx.restore();
            }
            gCtx.restore();
            gCtx.globalAlpha = 1.0;
        }

        function drawEraser(x, y, angle) {
            gCtx.save();
            gCtx.translate(x, y);
            gCtx.rotate(angle);
            gCtx.fillStyle = '#f78fb3';
            gCtx.beginPath(); gCtx.roundRect(-25, -12, 50, 24, 4); gCtx.fill();
            gCtx.strokeStyle = '#d15a84'; gCtx.lineWidth = 2; gCtx.stroke();
            gCtx.fillStyle = '#ffffff';
            gCtx.beginPath();
            gCtx.moveTo(-25, -12); gCtx.lineTo(-35, -6); gCtx.lineTo(-35, 6); gCtx.lineTo(-25, 12); gCtx.closePath();
            gCtx.fill();
            gCtx.strokeStyle = '#bdc3c7'; gCtx.stroke();
            gCtx.restore();
        }

        function drawPencil(x, y, angle) {
            gCtx.save();
            gCtx.translate(x, y);
            gCtx.rotate(angle);
            gCtx.fillStyle = '#f1c40f'; gCtx.fillRect(-15, -6, 30, 12);
            gCtx.strokeStyle = '#d35400'; gCtx.lineWidth = 1; gCtx.strokeRect(-15, -6, 30, 12);
            gCtx.fillStyle = '#e67e22';
            gCtx.beginPath(); gCtx.moveTo(15, -6); gCtx.lineTo(25, 0); gCtx.lineTo(15, 6); gCtx.closePath(); gCtx.fill();
            gCtx.fillStyle = '#2c3e50';
            gCtx.beginPath(); gCtx.moveTo(22, -2); gCtx.lineTo(25, 0); gCtx.lineTo(22, 2); gCtx.closePath(); gCtx.fill();
            gCtx.fillStyle = '#f78fb3'; gCtx.fillRect(-20, -6, 5, 12);
            gCtx.strokeStyle = '#555'; gCtx.strokeRect(-20, -6, 5, 12);
            gCtx.restore();
        }

        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
            this.beginPath(); this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
            this.closePath(); return this;
        }

        function createEraserDust(x, y) {
            for (let i = 0; i < 15; i++) {
                eraserDust.push({
                    x: x, y: y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                    life: 1.0, color: Math.random() > 0.5 ? '#f78fb3' : '#ffffff', size: Math.random() * 3 + 1
                });
            }
        }

        function updateGameUI() {
            let hpPercent = player.maxHp === 0 ? 0 : (player.hp / player.maxHp) * 100;
            document.getElementById('hp-fill').style.width = `${hpPercent}%`;
            document.getElementById('stats').innerHTML = `${t('hp')}: ${player.hp} / ${player.maxHp} (${t('strokes')}: ${player.activeStrokes.length})`;
        }

        function updateSkillUI() {
            document.getElementById('pencil-count').innerText = pencilInventory;
            const pencilCdEl = document.getElementById('pencil-cd');
            const swordCdEl = document.getElementById('sword-cd');
            const rulerCdEl = document.getElementById('ruler-cd');

            const mECd = document.getElementById('m-e-cd');
            const mTCd = document.getElementById('m-t-cd');
            const mZCd = document.getElementById('m-z-cd');

            if (pencilCooldownTimer > 0) {
                pencilCdEl.innerText = `${t('cooldown')}: ${Math.ceil(pencilCooldownTimer)}s`;
                pencilCdEl.className = 'skill-cooldown';
                mECd.innerText = `${Math.ceil(pencilCooldownTimer)}s`;
            } else if (pencilInventory <= 0) {
                pencilCdEl.innerText = t('out_of_pencils');
                pencilCdEl.className = 'skill-cooldown';
                mECd.innerText = 'X';
            } else {
                pencilCdEl.innerText = `${t('ready')} (E)`;
                pencilCdEl.className = 'skill-ready';
                mECd.innerText = '';
            }

            if (swordCooldownTimer > 0) {
                swordCdEl.innerText = `${t('cooldown')}: ${Math.ceil(swordCooldownTimer)}s`;
                swordCdEl.className = 'skill-cooldown';
                mTCd.innerText = `${Math.ceil(swordCooldownTimer)}s`;
            } else {
                swordCdEl.innerText = `${t('ready')} (T)`;
                swordCdEl.className = 'skill-ready';
                mTCd.innerText = '';
            }

            if (rulerCooldownTimer > 0) {
                rulerCdEl.innerText = `${t('cooldown')}: ${Math.ceil(rulerCooldownTimer)}s`;
                rulerCdEl.className = 'skill-cooldown';
                mZCd.innerText = `${Math.ceil(rulerCooldownTimer)}s`;
            } else {
                rulerCdEl.innerText = `${t('ready')} (Z)`;
                rulerCdEl.className = 'skill-ready';
                mZCd.innerText = '';
            }
        }

        function drawLeftPanel() {
            if (leftPanel.classList.contains('hidden')) {
                requestAnimationFrame(drawLeftPanel);
                return;
            }
            dCtx.fillStyle = '#fdfdfd';
            dCtx.fillRect(0, 0, drawWidth, drawHeight);
            dCtx.strokeStyle = '#e0e0e0';
            dCtx.lineWidth = 1;
            for(let i=0; i<drawWidth; i+=30) { dCtx.beginPath(); dCtx.moveTo(i, 0); dCtx.lineTo(i, drawHeight); dCtx.stroke(); }
            for(let i=0; i<drawHeight; i+=30) { dCtx.beginPath(); dCtx.moveTo(0, i); dCtx.lineTo(drawWidth, i); dCtx.stroke(); }

            dCtx.strokeStyle = '#1a1a1a';
            dCtx.lineWidth = 4;
            dCtx.lineCap = 'round';
            dCtx.lineJoin = 'round';

            strokes.forEach(stroke => {
                dCtx.beginPath();
                if (stroke.length === 1) {
                    dCtx.arc(stroke[0].x, stroke[0].y, 3, 0, Math.PI * 2);
                    dCtx.fillStyle = '#1a1a1a'; dCtx.fill();
                } else {
                    dCtx.moveTo(stroke[0].x, stroke[0].y);
                    for (let i = 1; i < stroke.length; i++) dCtx.lineTo(stroke[i].x, stroke[i].y);
                    dCtx.stroke();
                }
            });
            requestAnimationFrame(drawLeftPanel);
        }

        function mainLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            let dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            
            if (dt > 0.1) dt = 0.1;

            if (gameState === 'PLAYING') {
                updateGame(dt);
            }
            drawGame();
            requestAnimationFrame(mainLoop);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('load', () => {
            resize();
            updateDrawingUI();
            applyTranslations();
            drawLeftPanel();
            requestAnimationFrame(mainLoop);
        });
    </script>
</body>
